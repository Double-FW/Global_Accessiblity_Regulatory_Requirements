name: Update Global Accessibility Regulatory Requirements Hugging Face dataset

on:
  schedule:
    - cron: '57 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: global-regulatory-huggingface-sync
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'Double-FW/Global_Accessiblity_Regulatory_Requirements' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install publishing dependencies
        run: python -m pip install -r huggingface/requirements.txt
      - name: Test current-source export and publishing safeguards
        run: python -m unittest discover -s tests -p 'test_global_huggingface.py' -v
      - name: Build and validate Global Accessibility Regulatory Requirements dataset
        run: python scripts/export_huggingface.py --output "${RUNNER_TEMP}/global-regulatory-dataset"
      - name: Publish Global Accessibility Regulatory Requirements dataset
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/publish_huggingface.py --folder "${RUNNER_TEMP}/global-regulatory-dataset"
